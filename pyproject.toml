[project]
name = "company-os-cli"
version = "0.1.0"
description = "Scaffold a Git-Markdown Multi-Agent Company OS (LangGraph/LangChain skeleton) from the CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "as950118" }]
keywords = ["langgraph", "langchain", "multi-agent", "scaffold", "cli", "company-os"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/as950118/ai-company"
Repository = "https://github.com/as950118/ai-company"
Issues = "https://github.com/as950118/ai-company/issues"

[project.scripts]
company-os = "company_os_cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_os_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/company_os_cli/**",
    "tests/**",
    "README.md",
    "PLACEHOLDERS.md",
    "LICENSE",
]
