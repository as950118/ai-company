name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses PyPI Trusted Publishing (recommended, no token needed):
        # configure this repo/workflow as a trusted publisher at
        # https://pypi.org/manage/project/company-os-cli/settings/publishing/
        #
        # If you'd rather use a classic API token instead, remove the
        # `permissions.id-token` block above and uncomment:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
